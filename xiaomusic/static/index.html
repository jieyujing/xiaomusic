<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#171918" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="你的本地媒体库，为小爱音箱而设。" />
    <title>XiaoMusic · 本地音乐</title>
    <link rel="icon" href="/static/favicon.ico" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="stylesheet" href="/static/library/app.css?v=4" />
    <script src="/static/library/settings.js?v=1" defer></script>
    <script src="/static/library/manage.js?v=1" defer></script>
    <script src="/static/library/app.js?v=4" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到媒体库</a>
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="XiaoMusic 首页"
        ><span class="brand-mark" aria-hidden="true">ⅹ</span
        ><span>XiaoMusic<small>属于你的声音</small></span></a
      >
      <div class="nav-caption">我的空间</div>
      <nav class="main-nav" aria-label="主导航">
        <button data-view="library" class="active">
          <span data-icon="library"></span><span>媒体库</span>
        </button>
        <button data-view="folders">
          <span data-icon="folder"></span><span>播放列表</span>
        </button>
        <button data-view="queue">
          <span data-icon="queue"></span><span>当前列表</span
          ><span class="nav-count" id="queue-count"></span>
        </button>
        <button data-view="manage">
          <span data-icon="folder"></span><span>管理</span>
        </button>
        <button data-view="settings">
          <span data-icon="settings"></span><span>设置</span>
        </button>
      </nav>
      <div class="sidebar-note">
        <span class="status-dot"></span> 本地收藏，随时聆听<small
          >音乐留在家里。</small
        >
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span class="mobile-brand"
          >XiaoMusic<span class="status-dot"></span
        ></span>
        <span class="breadcrumb"
          >我的空间 <span>/</span>
          <strong id="breadcrumb-title">媒体库</strong></span
        >
        <label class="device-picker"
          ><span data-icon="speaker"></span><span class="sr-only">播放音箱</span
          ><select id="device-select">
            <option value="">正在获取音箱…</option></select
          ><span data-icon="chevron"></span
        ></label>
      </header>
      <main id="main" tabindex="-1">
        <section class="intro" id="intro">
          <div>
            <p class="eyebrow">你的声音收藏室</p>
            <h1>好音乐，就在身边。</h1>
            <p class="intro-copy">你的本地收藏，小爱为你播放。</p>
            <div class="library-stats" id="library-stats">正在读取媒体库…</div>
          </div>
          <div class="record-art" aria-hidden="true">
            <div class="record-sleeve">
              <span>MY<br />COLLECTION</span><small>用声音，记录生活。</small>
            </div>
            <div class="vinyl"><i></i></div>
          </div>
        </section>
        <section class="content-head">
          <div>
            <p class="eyebrow" id="section-kicker">LOCAL LIBRARY</p>
            <h2 id="section-title">我的媒体库</h2>
          </div>
          <button
            class="icon-button"
            id="reload"
            aria-label="重新加载媒体库"
            title="重新加载媒体库"
          >
            <span data-icon="refresh"></span>
          </button>
        </section>
        <div class="library-tools" id="library-tools">
          <div class="tabs" role="tablist" aria-label="浏览方式">
            <button role="tab" aria-selected="true" data-tab="songs">
              歌曲</button
            ><button role="tab" aria-selected="false" data-tab="artists">
              歌手</button
            ><button role="tab" aria-selected="false" data-tab="albums">
              专辑</button
            ><button role="tab" aria-selected="false" data-tab="favorites">
              收藏
            </button>
          </div>
          <label class="search-box"
            ><span data-icon="search"></span
            ><span class="sr-only">搜索本地媒体</span
            ><input
              id="search"
              type="search"
              placeholder="搜索歌曲、歌手、专辑"
              autocomplete="off" /><button
              class="icon-button"
              id="clear-search"
              aria-label="清除搜索"
              hidden
            >
              <span data-icon="close"></span></button
          ></label>
        </div>
        <div id="connection" class="notice" role="status" hidden></div>
        <div id="content" aria-busy="true">
          <div class="empty-state">
            <span data-icon="library"></span>
            <h3>正在打开你的收藏</h3>
            <p>读取本地媒体库…</p>
          </div>
        </div>
      </main>
      <footer class="page-footer">
        <span>XiaoMusic</span><span>只听自己收藏的好声音。</span>
      </footer>
    </div>
    <section class="player-dock" aria-label="播放控制">
      <button class="now-playing" id="expand-player" aria-haspopup="dialog">
        <span class="mini-cover" id="mini-cover" aria-hidden="true"></span
        ><span class="now-copy"
          ><strong id="now-title">选一首，开始聆听</strong
          ><small id="now-artist">播放到你的小爱音箱</small></span
        >
      </button>
      <div class="dock-center">
        <div class="transport">
          <button
            class="icon-button previous"
            data-action="previous"
            aria-label="上一首"
          >
            <span data-icon="previous"></span></button
          ><button
            class="play-button"
            data-action="toggle"
            aria-label="播放当前歌曲"
          >
            <span data-icon="play"></span></button
          ><button class="icon-button" data-action="next" aria-label="下一首">
            <span data-icon="next"></span>
          </button>
        </div>
        <div class="timeline">
          <span id="elapsed">0:00</span
          ><progress
            id="progress"
            max="100"
            value="0"
            aria-label="播放进度"
          ></progress
          ><span id="duration">0:00</span>
        </div>
      </div>
      <div class="dock-right">
        <span id="dock-device">未选择音箱</span
        ><button
          class="icon-button"
          data-view="queue"
          aria-label="打开当前播放列表"
        >
          <span data-icon="queue"></span>
        </button>
      </div>
    </section>
    <dialog id="player-dialog" class="player-dialog">
      <div class="dialog-top">
        <span>正在播放</span
        ><button class="icon-button" id="close-player" aria-label="关闭播放器">
          <span data-icon="close"></span>
        </button>
      </div>
      <div class="large-cover" id="large-cover" aria-hidden="true"></div>
      <h2 id="full-title">选一首，开始聆听</h2>
      <p id="full-artist">播放到你的小爱音箱</p>
      <div class="full-timeline">
        <progress
          id="full-progress"
          max="100"
          value="0"
          aria-label="播放进度"
        ></progress>
        <div>
          <span id="full-elapsed">0:00</span
          ><span id="full-duration">0:00</span>
        </div>
      </div>
      <div class="transport">
        <button class="icon-button" data-action="previous" aria-label="上一首">
          <span data-icon="previous"></span></button
        ><button
          class="play-button"
          data-action="toggle"
          aria-label="播放当前歌曲"
        >
          <span data-icon="play"></span></button
        ><button class="icon-button" data-action="next" aria-label="下一首">
          <span data-icon="next"></span>
        </button>
      </div>
      <div class="player-extras">
        <button
          class="button"
          id="favorite"
          aria-pressed="false"
          aria-label="收藏当前歌曲"
        >
          <span data-icon="heart"></span><span id="favorite-label">收藏</span>
        </button>
        <details class="sleep-timer">
          <summary>定时停止</summary>
          <div class="timer-options">
            <button class="button" data-sleep="10">10 分钟</button
            ><button class="button" data-sleep="30">30 分钟</button
            ><button class="button" data-sleep="60">60 分钟</button>
          </div>
          <p id="timer-feedback" role="status"></p>
        </details>
      </div>
      <p class="player-hint" id="player-hint">请选择音箱和歌曲</p>
      <label class="volume-label"
        ><span data-icon="volume"></span><span>音量</span
        ><input id="volume" type="range" min="0" max="100" value="0" /><output
          id="volume-value"
          >—</output
        ></label
      ><label class="mode-label"
        >播放模式<select id="play-mode">
          <option value="4">顺序播放</option>
          <option value="1">全部循环</option>
          <option value="2">随机播放</option>
          <option value="0">单曲循环</option>
          <option value="3">单曲播放</option>
        </select></label
      >
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
